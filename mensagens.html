<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAIN – Mensagens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body data-pagina="mensagens">

<!-- TOPBAR -->
<header class="topbar">
  <a href="dashboard.html" class="topbar__brand" title="Voltar ao feed">PLAIN <span>·</span></a>

  <div class="topbar__search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Buscar empresas, pessoas, projetos…" />
  </div>

  <nav class="topbar__nav">
    <a href="dashboard.html" class="topnav-btn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Início
    </a>
    <a href="rede.html" class="topnav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Rede
    </a>
    <a href="projetos.html" class="topnav-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      Projetos
    </a>
    <a href="mensagens.html" class="topnav-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Mensagens
    </a>
    <div class="topbar__divider"></div>
    <div class="avatar-btn" title="Meu Perfil" id="topAvatar">·</div>
  </nav>
</header>

<div class="layout layout--2col">

  <!-- LEFT: PROFILE -->
  <aside>
    <div class="card profile-card">
      <div class="profile-card__banner"></div>
      <div class="profile-card__avatar-wrap">
        <div class="profile-card__avatar" id="profileAvatar">·</div>
      </div>
      <div class="profile-card__info">
        <div class="profile-card__name" id="profileName">Carregando…</div>
        <div class="profile-card__role" id="profileRole">&nbsp;</div>
      </div>
      <div class="profile-card__divider"></div>
      <div class="profile-card__stat"><span>Não lidas</span><span>0</span></div>
      <div style="height:12px"></div>
    </div>
  </aside>

  <main class="page-main">

    <div class="card page-head">
      <div>
        <h1 class="page-head__title">Mensagens</h1>
        <p class="page-head__sub">Converse com suas conexões.</p>
      </div>
    </div>

    <div class="card empty-state inbox-empty">
      <div class="empty-state__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="empty-state__title">Nenhuma mensagem nova</div>
    </div>
  </main>
</div>

<script src="comum.js"></script>
</body>
</html>
