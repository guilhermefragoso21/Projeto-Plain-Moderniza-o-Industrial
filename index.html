<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAIN – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar__brand">
      <img id="logo-img" src="imagens/Logo PLAIN.png" alt="PLAIN Logo" class="navbar__logo" />
      <div class="navbar__brand-text">
      </div>
    </div>
    <nav class="navbar__nav">
      <a href="index.html" class="nav-link active">Início</a>
      <a href="quem-somos.html" class="nav-link">Quem somos</a>
      <a href="contato.html" class="nav-link">Contato</a>
    </nav>
    <div class="navbar__lang">
      <img src="https://flagcdn.com/w40/br.png" alt="Português" class="lang-flag" />
      <span class="lang-label">PT</span>
      <svg class="lang-chevron" viewBox="0 0 10 6" fill="none">
        <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
  </header>

  <main class="hero">
    <div class="hero__bg-wrapper">
      <img id="bg-img" src="imagens/fundosite.png" alt="Background" class="hero__bg" />
      <div class="hero__overlay"></div>
    </div>

    <div class="hero__content">
      <div class="hero__text">
        <h1 class="hero__title">Retrofit Industrial: Modernize Suas Máquinas</h1>
        <p class="hero__subtitle">Aumente a eficiência, reduza custos e prolongue a vida útil dos seus equipamentos com soluções tecnológicas avançadas.</p>
      </div>

      <!-- ============ CARD DE LOGIN ============ -->
      <div class="hero__card" id="card-login">
        <h2 class="card__heading">Acessar conta</h2>

        <p class="card__section-label">Dados</p>

        <div class="card__form" id="form-login">
          <div class="form-grid form-grid--single">
            <input type="email" class="form-input" placeholder="E-mail" />
            <input type="password" class="form-input" placeholder="Senha" />
          </div>
          <button class="form-submit" onclick="handleLogin()">Entrar</button>

          <p class="card__signup-text">
            Não tem uma conta?
            <a href="criar-conta.html" class="card__signup-link">Criar conta</a>
          </p>
        </div>
      </div>

    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
